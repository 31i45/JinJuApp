[package]
name = "JinJuApp"
version = "2.1.1"
edition = "2024"
description = "A taskbar-side quote ticker for Windows"
license = "MIT"
repository = "https://github.com/31i45/JinJuApp"
build = "build.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
